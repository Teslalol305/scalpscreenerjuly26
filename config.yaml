# TapeScreen configuration. Validated at startup by tapescreen/config.py;
# invalid or missing keys produce a clear error naming the key.
# All rule thresholds are starting points, not truths - tune them against /stats.

ui:
  port: 5560
  sound_default: false          # ALERT-tier sound toggle default in the browser
  push_interval_ms: 250         # server->browser batched diff cadence

symbols_file: symbol_map.yaml

feeds:
  hyperliquid:
    ws_url: wss://api.hyperliquid.xyz/ws
    info_url: https://api.hyperliquid.xyz/info
    ping_interval_s: 30         # server closes idle (>60s silent) connections
    watchdog_timeout_s: 10      # no message in 10s -> reconnect
    backoff_initial_s: 1.0
    backoff_max_s: 60.0
    warmup:                     # startup REST snapshots (skipped if unreachable)
      candles: true             # seed 1m bars for ATR/BB/RSI/EMA/VWAP baselines
      candle_bars: 120
      funding_history: true     # seed 7-day funding percentile
  binance:
    enabled: false              # secondary venue module, deferred to v1.1

recorder:
  enabled: true
  path: recordings
  rotate_mb: 256

staleness:
  symbol_stale_s: 30            # no tick in 30s -> UI grays the row

state:
  bars_1s_cap: 3600             # ring-buffer caps; see core/state.py header
  bars_1m_cap: 480              # ~8h session scope
  tick_window_s: 330            # rolling tick retention (covers 5m lookbacks)
  baseline_window_s: 1800       # trailing 30-min baselines (vol z, sizes, tps)

features:
  large_print_pctl: 99          # single trade >= p99 of trailing 30-min sizes
  burst_k: 6                    # >=K same-side aggressor trades ...
  burst_window_s: 2.0           # ... within T seconds
  wall_mult: 5.0                # level >= 5x median of top-10 level sizes
  book_top_levels: 10

rules:
  momentum_ignition:
    weight: 30
    roc_window_s: 30
    roc_sigma_mult: 2.5         # |ROC(30s)| >= 2.5x its trailing 30-min sigma
    vol_z_min: 2.5
    max_spread_bps: 8.0
  sweep_reclaim:
    weight: 30
    lookback_min: 15
    atr_mult: 0.25              # print beyond prior 15-min extreme by >=0.25x ATR(1m)
    reclaim_window_s: 45
  vwap_fade:                    # tagged counter-trend
    weight: 20
    band_sigma: 2.5
    vol_peak_window_min: 5
  squeeze_release:
    weight: 25
    bb_width_pctl_max: 10
    squeeze_min_minutes: 10
    range_atr_mult: 2.0
    vol_z_min: 2.0
  book_imbalance:
    weight: 15
    imbalance_high: 0.65
    imbalance_low: 0.35
    sustain_s: 20
    range_proximity_bps: 10.0
    range_lookback_min: 15
  oi_compression:               # context flag, no side, never alerts
    weight_mult: 1.10           # multiplies composite score when active
    doi_pctl: 95
    roc_sigma_max: 0.3
  funding_extremity:            # context flag / bias badge, never alerts
    weight_mult_aligned: 1.10   # signal side agrees with funding bias
    weight_mult_against: 0.90
    pctl: 95                    # |funding| >= trailing 7-day p95

composite:
  watch_score: 60
  alert_score: 80
  rule_cooldown_s: 90           # per (symbol, rule)
  alert_cooldown_s: 60          # per (symbol, side)

stats:
  spread_haircut_bps: 2.0       # hit = signed fwd return > haircut
  taker_fee_bps: 4.5            # venue taker fee per side; trades are judged net
                                #   of a full taker round trip (2x) + the spread
  horizons_s: [30, 60, 180, 300]
  mfe_mae_window_s: 300

# Validation bar: when a strategy's measured record is large, long, and
# confidently positive net of costs, it graduates to "validated". Until then
# the dashboard says so, plainly. A confident NEGATIVE verdict is also an
# outcome - it rejects the strategy and saves real money.
validation:
  min_trades: 150               # resolved R-trades required per strategy
  min_days: 28                  # distinct active days required (regime coverage)

# Trade-signal ledger + self-learning confidence (screener only - no orders).
# Trade plans mirror a scale-in / manage-the-winner style: laddered entries,
# scale-out at +1R with stop to break-even, trailing stop, multi-hour holds.
learning:
  enabled: true
  prior_wins: 3.0               # Beta prior: confidence starts at 50% and
  prior_losses: 3.0             #   moves only as real outcomes accumulate
  min_bucket_n: 20              # rule+symbol bucket needs this many samples,
                                #   else confidence backs off to the rule bucket
  weight_mult_min: 0.6          # learned composite-weight multiplier bounds
  weight_mult_max: 1.4
  weight_min_n: 10              # rule needs this many resolutions before its
                                #   composite weight is adjusted at all
  stop_atr_min: 1.0             # stop distance clamp, in ATR(1m) multiples
  stop_atr_max: 4.0             #   (wider: holds run minutes-to-hours)
  one_per_side: true            # one active signal per (symbol, side)
  # --- entry ladder (scale-in) ---
  entry_levels: 3               # tranches: signal price + adds at better prices
  entry_step_r: 0.5             # each add sits 0.5R below (long) the previous
  entry_window_s: 900           # adds may fill for 15 min, then ladder freezes
  # --- trade management ---
  tp1_r: 1.0                    # at +1R: scale out 1/3 and move stop to break-even
  tp1_fraction: 0.333
  trail_start_r: 1.5            # at +1.5R a trailing stop activates ...
  trail_dist_r: 1.0             # ... trailing 1R behind the best price
  max_hold_s: 7200              # TIME exit at 2 hours
  # --- online model (per-rule logistic regression on entry context) ---
  model_enabled: true
  model_lr: 0.05                # SGD learning rate
  model_l2: 0.001               # L2 regularization
  model_min_n: 30               # below this many updates, confidence uses the
                                #   Beta bucket; above, the model's probability
  refit_epochs: 3               # boot-time refit passes over stored history

# The research desk: a bounded, deterministic "quant panel" that studies every
# resolved outcome. It promotes candidate variables into the models when they
# prove predictive (and retires them when the evidence decays), puts weak
# strategies on probation behind a higher confidence bar, and guarantees
# exploration so a gated strategy can never be starved of the data it needs
# to clear itself. Every action is narrated to the reasoning trace.
research:
  enabled: true
  interval_s: 120               # desk meeting cadence (only acts on new outcomes)
  min_rule_n: 12                # analyst reports a rule once n >= this
  probation_min_n: 25           # risk officer needs this much evidence to gate
  probation_enter: 0.45         # posterior win rate below this -> probation
  probation_exit: 0.50          # posterior at/above this -> probation lifted
  probation_conf_min: 0.55      # gated fires need this win probability to open
  exploration_every: 4          # 1 in N suppressed fires opens anyway
  promote_r: 0.15               # |win correlation| to promote a candidate variable
  promote_min_n: 40             # resolved trades (with candidates) before scouting
  demote_r: 0.05                # decayed |r| that retires a promoted variable
  max_extras: 6                 # cap on promoted variables (bounded model growth)
  stagnant_meetings: 6          # no-change meetings before the loop-breaker acts
  retire_cooldown_h: 24         # retired variables sit out this long

# Continuous self-verification: boot logic selftest + runtime data/logic audits.
audit:
  selftest_on_boot: true        # re-verify core math vs known constants at startup
  interval_s: 30                # runtime audit cadence
  price_divergence_pct: 1.0     # trade price vs venue allMids tolerance
  mids_fresh_s: 30              # only compare against a mid this recent
  quarantine_clear_checks: 3    # clean audits required to lift a quarantine

db:
  path: data/tapescreen.db

logging:
  path: logs
  feed_debug: false
