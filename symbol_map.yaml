# TapeScreen symbol map: ui_symbol -> venue mapping.
# Generated 2026-07-26 from official SDK sources (hyperliquid-python-sdk 0.24.0,
# @nktkas/hyperliquid 0.33.2) + listing research. The build sandbox could not reach
# api.hyperliquid.xyz, so statuses are `verified_research`; run
# `python scripts/verify_symbols.py` from a machine with API access to re-verify
# live (it rewrites this file with status `verified_live` + szDecimals/maxLeverage).
# The app re-checks at startup and marks missing/delisted symbols unavailable.
symbols:
