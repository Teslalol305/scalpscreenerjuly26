  # Fallback if ever absent: Binance USDS-M NEARUSDT (v1.1 adapter).
  NEAR: {venue: hyperliquid, venue_symbol: NEAR, status: verified_research}
  TAO:  {venue: hyperliquid, venue_symbol: TAO,  status: verified_research}
  WLD:  {venue: hyperliquid, venue_symbol: WLD,  status: verified_research}
  ZEC:  {venue: hyperliquid, venue_symbol: ZEC,  status: verified_research}
